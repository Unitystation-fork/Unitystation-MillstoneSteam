services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - NUXT_PUBLIC_API_BASE=https://milestone.unionrolistes.fr
      # Les variables du .env (noms ci-dessous) sont recopiées vers les NUXT_*
      # que lit le serveur Nuxt au runtime (le .env n'est pas lu par le serveur construit).
      - NUXT_PUBLIC_DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - NUXT_DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - NUXT_PUBLIC_DISCORD_CLIENT_REDIRECT=${DISCORD_CLIENT_REDIRECT:-}
      - NUXT_PUBLIC_TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - NUXT_TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - NUXT_PUBLIC_TWITCH_CLIENT_REDIRECT=${TWITCH_CLIENT_REDIRECT:-}
    container_name: app
    restart: always
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.milestone.rule=Host(`milestone.unionrolistes.fr`)"
      - "traefik.http.routers.milestone.entrypoints=websecure"
      - "traefik.http.routers.milestone.tls.certresolver=le"
      - "traefik.http.services.milestone.loadbalancer.server.port=3000"
    volumes:
      - ./prisma/milestone.db:/app/.output/server/prisma/milestone.db

  # Applique les migrations à la vraie base : voir « Migrations en production » du README.
  migrate:
    build:
      context: .
      target: build
    profiles:
      - migrate
    env_file:
      - .env
    command: npx prisma migrate deploy
    volumes:
      - ./prisma/milestone.db:/app/prisma/milestone.db

networks:
  traefik-public:
    external: true



